name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todocook
          POSTGRES_PASSWORD: todocook
          POSTGRES_DB: todocook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todocook"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://todocook:todocook@localhost:5432/todocook
      TEST_DATABASE_URL: postgresql://todocook:todocook@localhost:5432/todocook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      # Déploiement type : serveur sans migration automatique, migrations lancées à part sur une base vierge
      - name: Migrations explicites sur une base vierge (DB_AUTO_MIGRATE=false)
        env:
          PGPASSWORD: todocook
          DB_AUTO_MIGRATE: "false"
          DATABASE_URL: postgresql://todocook:todocook@localhost:5432/todocook_deploy
        run: |
          psql -h localhost -U todocook -d todocook -c "CREATE DATABASE todocook_deploy"
          npm run db:migrate
          tables=$(psql -h localhost -U todocook -d todocook_deploy -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users', 'recipes', 'sessions', 'food_journal', 'schema_migrations')")
          test "$tables" = "5" || { echo "Tables manquantes après db:migrate ($tables/5)"; exit 1; }
          npm run db:seed
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
