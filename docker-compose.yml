services:
  postgres:
    image: postgres:16-alpine
    container_name: todocook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todocook
      POSTGRES_PASSWORD: todocook
      POSTGRES_DB: todocook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
